plugins {
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.jetbrains.kotlin.jvm' version '2.3.20'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
// Local workspace references are optional and never committed.
def localBuildProperties = new Properties()
def localBuildFile = file('local.properties')
if (localBuildFile.exists()) {
    localBuildFile.withInputStream { localBuildProperties.load(it) }
}
def localReferenceDirs = localBuildProperties.getProperty('gtohjs.referenceDirs', '')
        .split(/\|/).findAll { !it.isBlank() }
kotlin { jvmToolchain(21) }
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
        javaParameters.set(true)
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
}
repositories {
    // Local runtime artifacts have no published development-POM dependency chain.
    flatDir {
        dirs(['libs'] + localReferenceDirs)
    }
    mavenCentral()
    maven { url 'https://maven.minecraftforge.net/' }
    maven { url 'https://gtodyssey.com/maven/releases' }
    maven { url 'https://api.modrinth.com/maven' }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Compile against the authoritative release API; never embed its JAR.
    // Isolate the dev11 mapped Core cache from prior pack snapshots.
    compileOnly fg.deobf('local.gtohjs.dev11:gtocore-forge-1.20.1:26.10.1')
    compileOnly fg.deobf('local.gtohjs:gtceu-1.20.1-forge-1.20.1:26.10.17')
    compileOnly fg.deobf('local.gtohjs:datasynclib-forge-1.20.1:26.9.4')
    compileOnly('com.gto.fastcollection:FastCollection:26.8.7') { transitive = false }
    compileOnly fg.deobf('local.gtohjs:ldlib-forge-1.20.1:1.0.52.a')
    compileOnly fg.deobf('local.gtohjs:appliedenergistics2-forge-1.20.1:15.2610.4')
    compileOnly fg.deobf('local.gtohjs:fastrecipesearch-1.20.1:26.8.4-forge')
    compileOnly('local.gtohjs:RecipeSearch:26.8.4')
    compileOnly fg.deobf('local.gtohjs:Botania-1.20.1:456-FORGE')
    compileOnly fg.deobf('local.gtohjs:emi:1.1.24+1.20.1+forge')
    compileOnly fg.deobf('local.gtohjs:configuration-forge-1.20.1:3.1.0')
    compileOnly fg.deobf('maven.modrinth:jade:11.13.1+forge')
    compileOnly('org.jetbrains.kotlin:kotlin-stdlib:2.3.20') { transitive = false }
    testRuntimeOnly('org.jetbrains.kotlin:kotlin-stdlib:2.3.20') { transitive = false }
}
configurations.testCompileOnly.extendsFrom(configurations.compileOnly)
tasks.register('verifyGeneratedRecipes', JavaExec) {
    dependsOn tasks.named('testClasses')
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.gtohjs.methods.GeneratedRecipeCodeCheck'
    // New mapped dependencies must resolve outside this task's configuration guard.
    doFirst {
        setArgs([layout.buildDirectory.dir('generated-recipe-check').get().asFile.absolutePath,
                (sourceSets.main.output + sourceSets.main.compileClasspath).asPath,
                file('src/main/resources').absolutePath])
    }
}
tasks.named('check').configure { dependsOn tasks.named('verifyGeneratedRecipes') }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
def generatedGtlLanguage = layout.buildDirectory.dir('generated/gtl-machine-language')
tasks.register('generateGtlMachineLanguage', JavaExec) {
    dependsOn tasks.named('compileKotlin')
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    classpath = files(tasks.named('compileKotlin').flatMap { it.destinationDirectory }) + sourceSets.main.compileClasspath
    mainClass = 'com.gtohjs.methods.GtlPortedMachineText'
    args file('src/main/resources/assets/gtohjs/lang').absolutePath,
            generatedGtlLanguage.get().asFile.absolutePath
    inputs.files(file('src/main/resources/assets/gtohjs/lang/zh_cn.json'),
            file('src/main/resources/assets/gtohjs/lang/en_us.json'))
    outputs.dir(generatedGtlLanguage)
}
tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('generateGtlMachineLanguage')
    inputs.dir(generatedGtlLanguage)
    def replacements = [
        mod_id: mod_id, mod_name: mod_name, mod_loader_version: mod_loader_version,
        mod_authors: mod_authors, mod_license: mod_license
    ]
    inputs.properties replacements
    doFirst {
        if (!(mod_loader_version ==~ /[0-9].*/)) {
            throw new GradleException('Forge mod_loader_version must start with a digit; use mod_version for the artifact label.')
        }
    }
    filesMatching('META-INF/mods.toml') { expand replacements }
    doLast {
        project.copy {
            from(generatedGtlLanguage.get().asFile)
            into(destinationDir)
        }
    }
}
tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_version}.jar"
    from('LICENSE') { into 'META-INF'; rename { 'LICENSE_GTOHJS' } }
    manifest {
        attributes 'Implementation-Version': project.version,
                   'Implementation-Title': 'GTOHJS dev11 machine adaptation'
    }
    finalizedBy 'reobfJar'
}
